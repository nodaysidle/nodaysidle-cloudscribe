<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="volt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8FF00"/>
      <stop offset="100%" style="stop-color:#a0dd00"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <!-- Mic icon -->
  <g transform="translate(170, 110)" fill="none" stroke="url(#volt)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mic body -->
    <rect x="52" y="0" width="68" height="140" rx="34" ry="34"/>
    <!-- Mic base -->
    <path d="M0,180 L32,270 L140,270 L172,180"/>
    <!-- Stand -->
    <line x1="86" y1="270" x2="86" y2="340"/>
    <!-- Base arc -->
    <path d="M30,340 Q86,370 142,340"/>
  </g>
  <!-- Sound waves -->
  <g transform="translate(256,300)" fill="none" stroke="#C8FF00" stroke-width="12" stroke-linecap="round" opacity="0.7">
    <path d="M-40,-20 Q-80,0 -40,20" stroke-dasharray="4 6" opacity="0.5"/>
    <path d="M-50,-35 Q-110,0 -50,35" stroke-dasharray="6 8" opacity="0.3"/>
    <path d="M40,-20 Q80,0 40,20" stroke-dasharray="4 6" opacity="0.5"/>
    <path d="M50,-35 Q110,0 50,35" stroke-dasharray="6 8" opacity="0.3"/>
  </g>
  <!-- Cloud dots indicating cloud processing -->
  <circle cx="350" cy="120" r="12" fill="#C8FF00" opacity="0.4"/>
  <circle cx="390" cy="100" r="8" fill="#C8FF00" opacity="0.3"/>
  <circle cx="410" cy="130" r="10" fill="#C8FF00" opacity="0.35"/>
  <circle cx="370" cy="150" r="9" fill="#C8FF00" opacity="0.25"/>
</svg>
